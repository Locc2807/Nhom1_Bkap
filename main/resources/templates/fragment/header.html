<!-- layout/header.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Header</title>

<!-- Google font -->
<link
	href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700"
	rel="stylesheet">

<!-- CSS (Ensure the correct path to your styles) -->
<link rel="stylesheet" href="/assets/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/css/style.css">
<!--<link type="text/css" rel="stylesheet" th:href="@{assets/css/account-style.css}" />  -->

</head>
<body>


	<div th:fragment="header">
		<header>
			<!-- TOP HEADER -->
			<div id="top-header">
				<div class="container">
					<ul class="header-links pull-left">
						<li><a href="#"><i class="fa fa-phone"></i> +021-95-51-84</a></li>
						<li><a href="#"><i class="fa fa-envelope-o"></i>
								email@email.com</a></li>
						<li><a href="#"><i class="fa fa-map-marker"></i> 1734
								Stonecoal Road</a></li>
					</ul>
					<ul class="header-links pull-right">
						<li><a href="#"><i class="fa fa-dollar"></i> USD</a></li>
						<li><a href="/customer/login"
							th:if="${session.customer == null}"> <i class="fa fa-user-o"></i>
								My Account
						</a>

							<div th:if="${session.customer != null}" class="dropdown"
								onclick="toggleDropdown(event)">
								<button class="dropdown-btn">
									<span th:text="${session.customer.name}" id="accountName">David</span>
								</button>

								<div class="dropdown-content ">
									<span class="close-btn" onclick="closeDropdown(event)">&#10005;</span>
									<p class="email-text" th:text="${session.customer.email}">david@example.com</p>
									<p class="greeting-text">
										Hello <span th:text="${session.customer.name}">David</span>
									</p>
									
									<div class="dropdown-buttons">
    <a th:href="@{/customer/profile}" class="btn btn-info">
        <i style="color:white;" class="fa fa-user-circle"></i> Profile
    </a>
    <a th:href="@{/customer/signout}" class="btn btn-success">
        
            <i style="color:white;" class="fa fa-sign-out"></i> Sign Out
       
    </a>
</div>
								</div>
							</div> <script>
								// Toggle dropdown visibility
								function toggleDropdown(event) {
									// Prevent click event from propagating to close function
									event.stopPropagation();
									var dropdownContent = document
											.querySelector('.dropdown-content');
									dropdownContent.classList.toggle('show');
								}

								// Close the dropdown
								function closeDropdown(event) {
									event.stopPropagation(); // Prevent this click from closing the dropdown
									var dropdownContent = document
											.querySelector('.dropdown-content');
									dropdownContent.classList.remove('show');
								}

								// Close dropdown when clicking outside of it
								document
										.addEventListener(
												'click',
												function(event) {
													var dropdownContent = document
															.querySelector('.dropdown-content');
													if (!dropdownContent
															.contains(event.target)
															&& !event.target
																	.closest('.dropdown-btn')) {
														dropdownContent.classList
																.remove('show');
													}
												});
							</script></li>
					</ul>
				</div>
			</div>
			<!-- /TOP HEADER -->

			<!-- MAIN HEADER -->
			<div id="header">
				<div class="container">
					<div class="row">
						<!-- LOGO -->
						<div class="col-md-3">
							<div class="header-logo">
								<a href="#" class="logo"> <img src="./img/logo.png" alt="">
								</a>
							</div>
						</div>
						<!-- /LOGO -->

						<!-- SEARCH BAR -->
						<div class="col-md-6">
							<div class="header-search">
								<form>
									<select class="input-select">
										<option value="0">All Categories</option>
										<option value="1">Category 01</option>
										<option value="1">Category 02</option>
									</select> <input class="input" placeholder="Search here">
									<button class="search-btn">Search</button>
								</form>
							</div>
						</div>
						<!-- /SEARCH BAR -->

						<!-- ACCOUNT -->
						<div class="col-md-3 clearfix">
							<div class="header-ctn">
								<div>
									<a href="#"> <i class="fa fa-heart-o"></i> <span>Your
											Wishlist</span>
										<div class="qty">2</div>
									</a>
								</div>

								<div class="dropdown">
									<a class="dropdown-toggle" data-toggle="dropdown"
										aria-expanded="true"> <i class="fa fa-shopping-cart"></i>
										<span>Your Cart</span>
										<div class="qty">3</div>
									</a>
									<div class="cart-dropdown">
										<div class="cart-list">
											<!-- Product widgets ở đây -->
										</div>
										<div class="cart-summary">
											<small>3 Item(s) selected</small>
											<h5>SUBTOTAL: $2940.00</h5>
										</div>
										<div class="cart-btns">
											<a href="#">View Cart</a> <a href="#">Checkout <i
												class="fa fa-arrow-circle-right"></i></a>
										</div>
									</div>
								</div>

								<div class="menu-toggle">
									<a href="#"> <i class="fa fa-bars"></i> <span>Menu</span>
									</a>
								</div>
							</div>
						</div>
						<!-- /ACCOUNT -->
					</div>
				</div>
			</div>
			<!-- /MAIN HEADER -->
		</header>
	</div>
</body>
