<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <!-- Bootstrap 4 CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        h2 {
            text-align: center;
        }
        .alert {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Button styling to position it at the top left */
        .home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
        }

        .home-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Home Button -->
    <a th:href="@{/customer/profile}" class="home-btn">Back to Home</a>

    <div class="container mt-5">
        <div class="form-container">
            <h2>Change Password</h2>
            
            <form th:action="@{/customer/change-password}" th:object="${changePasswordForm}" method="post">
                <!-- Error Message -->
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                
                <!-- Success Message -->
                <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>
                
                <!-- Old Password -->
                <div class="form-group">
                    <label for="oldPassword">Old Password:</label>
                    <input type="password" id="oldPassword" th:field="*{oldPassword}" class="form-control" required />
                </div>
                
                <!-- New Password -->
                <div class="form-group">
                    <label for="newPassword">New Password:</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" required minlength="6"/>
                </div>
                
                <!-- Confirm New Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password:</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" required minlength="6"/>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block">Change Password</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 4 JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
