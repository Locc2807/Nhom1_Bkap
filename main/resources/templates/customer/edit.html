<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css">
    <style>
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
        }

        h2 {
            text-align: center;
        }

        .alert {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Button group styling */
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .home-btn, .save-btn {
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
        }

        .home-btn {
            background-color: #007bff;
            color: white;
            text-decoration: none;
        }

        .home-btn:hover {
            background-color: #0056b3;
        }

        .save-btn {
            background-color: #28a745;
            color: white;
            border: none;
        }

        .save-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Edit Your Profile</h2>

        <!-- Form to edit customer profile -->
        <form th:action="@{/customer/edit}" th:object="${customer}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />

            <div class="form-group">
                <label for="name">ID</label>
                <input type="text" th:field="*{id}" class="form-control" placeholder="Enter ID" required />
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Enter name" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="Enter email" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control" placeholder="Enter phone number" />
            </div>

            <div class="form-group">
                <label>Gender</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:field="*{gender}" value="MALE" id="genderMale">
                    <label class="form-check-label" for="genderMale">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:field="*{gender}" value="FEMALE" id="genderFemale">
                    <label class="form-check-label" for="genderFemale">Female</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:field="*{gender}" value="OTHER" id="genderOther">
                    <label class="form-check-label" for="genderOther">Other</label>
                </div>
            </div>

            <!-- Birthday -->
            <input type="date" th:value="${customer.birthday != null} ? ${#dates.format(customer.birthday, 'yyyy-MM-dd')} : ''"
                   name="birthday" class="form-control" max="9999-12-31" />

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="Enter address" />
            </div>

            <input type="hidden" th:field="*{password}" />

            <!-- Profile Picture Upload -->
            <div class="form-group">
                <label for="profilePicture">Profile Picture</label>
                <input type="file" name="profilePictureFile" class="form-control-file" accept="image/*" />
            </div>

            <!-- Button Group for Save and Home -->
            <div class="button-group">
                <!-- Back to Home Button -->
                <button type="submit" class="save-btn">Save Changes</button>
                <a th:href="@{/customer/profile}" class="home-btn">Back</a>

                <!-- Save Changes Button -->
                
            </div>
        </form>
    </div>

    <!-- Include Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
</body>
</html>
